{% extends "base.html" %}
{% block content %}
    <div class="w-1/3 mx-auto my-10">
        <h2 class='text-xl text-center font-bold'>LOGIN</h2>
        {% if messages %}
            {% for message in messages %}
                <p class="bg-green-500 py-2 px-1 mb-2 text-white">{{message}}</p>
            {% endfor %}
        {% endif %}
        <form action="{% url "log-in" %}" method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="bg-green-500 p-2 mt-3 rounded-md text-white">Log in</button>
            <div>
                <a class="mt-2" href="{% url "password_reset" %}">Forgot password?</a>
            </div>        
        </form>
    </div>
{% endblock content %}
