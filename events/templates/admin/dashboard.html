{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "css/output.css" %}">
    <title>General Dashboard</title>
</head>
<body>
    {% comment %} nav bar {% endcomment %}
    <nav class=" text-black font-normal">
        <div class="flex justify-between items-center w-5/6 mx-auto">
            <a href="{% url "view-dashboard" %}">
                <div class="text-2xl py-5 font-normal">Dashboard</div>
            </a>
            <div class="flex justify-between items-center">
                <div class="px-4 flex">
                    <a class="px-3 " href="{% url "home" %}">Home</a>
                    <a class="px-3 " href="{% url "home" %}">Events</a>
                    <a class="px-3 " href="{% url "view-participants" %}">Participants</a>
                    <a class="px-3d" href="{% url "view-groups" %}">Groups</a>
                    <a class="px-3 " href="{% url "create-group" %}">Create Groups</a>
                    <form method="POST">
                        {% csrf_token %}
                        <a class="px-2" href="{% url "log-out" %}">Log out</a>
                    </form>
                </div>
                <a href="">
                    <svg xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="h-10 w-10">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                </a>
            </div>
        </div>
    </nav>

    {% block content %}
        {% include "admin/users_list.html" %}
    {% endblock content %}
</body>
</html>
