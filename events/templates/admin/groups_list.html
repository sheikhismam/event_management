{% extends "admin/dashboard.html" %}
{% block title %}Delete Groups{% endblock title %}
{% block content %}
<div class="w-1/2 mx-auto my-10">
  <div class="bg-white shadow-md rounded-lg p-6">
    <h2 class="text-2xl font-semibold text-gray-800 mb-4 text-center">List of Groups</h2>

    <table class="w-full border-collapse border border-gray-200">
      <thead class="bg-gray-100">
        <tr>
          <th class="border border-gray-200 px-4 py-2 text-left text-gray-700">Group Name</th>
          <th class="border border-gray-200 px-4 py-2 text-center text-gray-700">Action</th>
        </tr>
      </thead>

      <tbody>
        {% for group in groups %}
        <tr class="hover:bg-gray-50">
          <td class="border border-gray-200 px-4 py-2">{{ group.name }}</td>
          <td class="border border-gray-200 px-4 py-2 text-center">
            <form method="POST" action="{% url 'delete-group' group.id %}">
              {% csrf_token %}
              <button 
                type="submit" 
                class="bg-red-600 hover:bg-red-700 text-white font-semibold px-4 py-2 rounded-md transition"
              >
                Delete
              </button>
            </form>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="2" class="text-center text-gray-500 py-4">
            No Group found.
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock content %}
