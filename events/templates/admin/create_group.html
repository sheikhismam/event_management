{% extends "admin/dashboard.html" %}
{% block title %}Create group{% endblock title %}
{% block content %}
<div class="w-1/3 mx-auto">
    {% if messages %}
        {% for message in messages %}
            <p class="bg-green-600 p-2 m-2">{{message}}</p>
        {% endfor %}
    {% endif %}
    <form action="" method="POST">
        {% csrf_token %}
        {{form}}
        <button type="submit" class="bg-green-500 rounded-md p-2 mt-2 text-white font-medium">Create Group</button>
    </form>
</div>

{% endblock content %}
