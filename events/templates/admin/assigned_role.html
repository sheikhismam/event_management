{% extends "admin/dashboard.html" %}
{% block content %}
<div class="w-1/3 mx-auto mt-12">
    {% if messages %}
        {% for message in messages %}
            <p class="bg-green-400 p-2 m-1">{{message}}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <label for="field.id_for_label">{{field.label}}</label>
            {{field}}
        {% endfor %}
        <button type="submit" class="bg-blue-600 p-2 mt-2 text-white rounded-md">Assign Role</button>
    </form>
</div>
{% endblock content %}
