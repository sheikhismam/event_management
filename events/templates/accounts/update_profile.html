{% extends "user/dashboard.html" %}
{% block title %}Update Profile Form{% endblock title %}
{% block content %}
<div class="w-1/3 mx-auto py-10">  
    <h2 class='text-xl text-center font-bold mb-5'>Update Your Profile</h2>
    {% if messages %}
        {% for message in messages %}
            <p class="bg-green-500 text-white font-lg">{{message}}</p>
        {% endfor %}
    {% endif %}
    <form action="" method="POST" enctype='multipart/form-data'> 
        {% csrf_token %}
        {{form.as_p}} 
        <button type="submit" class="bg-blue-500 hover:bg-blue-70 rounded-md text-white px-2 py-1 mt-2 font-medium">Update Profile</button> 
    </form> 
</div>

{% endblock content %}
