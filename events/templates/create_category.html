{% extends "base.html" %}
{% block title %}Create Category{% endblock title %}
{% block content %}
<div class="w-1/3 mx-auto my-10">
    <h2 class="text-center font-semibold text-xl">Create Category</h2>
    <form action="" method="POST">
        {% csrf_token %}
        {{form}}
        <button type="submit" class="py-2 px-1 mt-2 bg-green-500 rounded-md text-white">Create Category</button>
    </form>
</div>
{% endblock content %}
